<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
 <title>The greenhouse effect</title>
 <desc>Sunlight reaches Earth's surface. Heat leaves the surface. Greenhouse gases such as carbon dioxide, methane and water vapour trap some of the heat, and some escapes to space.</desc>
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1F2933"/></marker>
  <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B42318"/></marker>
 </defs>
 <rect width="640" height="420" rx="20" fill="#F7F9F5"/>
 <g font-family="Segoe UI, system-ui, sans-serif" fill="#1F2933">
  <circle cx="70" cy="64" r="36" fill="#F2A900"/>
  <text x="122" y="56" font-size="22" font-weight="700">Sunlight</text>
  <rect x="0" y="134" width="640" height="78" fill="#DFF3EC"/>
  <text x="320" y="166" font-size="20" font-weight="700" text-anchor="middle" fill="#0B3D2E">Greenhouse gases</text>
  <text x="320" y="194" font-size="18" text-anchor="middle" fill="#0B3D2E">carbon dioxide, methane, water vapour</text>
  <path d="M80 100 L150 330" stroke="#1F2933" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <path d="M240 330 L310 214" stroke="#B42318" stroke-width="4" fill="none" stroke-dasharray="10 6"/>
  <path d="M310 214 L380 330" stroke="#B42318" stroke-width="4" fill="none" stroke-dasharray="10 6" marker-end="url(#h)"/>
  <path d="M560 330 L606 112" stroke="#B42318" stroke-width="4" fill="none" stroke-dasharray="10 6" marker-end="url(#h)"/>
  <text x="600" y="50" font-size="18" text-anchor="end">Some heat escapes</text>
  <text x="600" y="74" font-size="18" text-anchor="end">to space</text>
  <text x="400" y="262" font-size="18">Some heat</text>
  <text x="400" y="286" font-size="18">is trapped</text>
  <path d="M0 340 Q320 312 640 340 L640 400 Q640 420 620 420 L20 420 Q0 420 0 400z" fill="#0B3D2E"/>
  <text x="320" y="392" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">Heat leaving Earth's surface</text>
 </g>
</svg>
