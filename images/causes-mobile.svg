<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" width="360" height="500">
 <title>Causes of climate change</title>
 <desc>Three human activities release greenhouse gases into the atmosphere: fossil fuels release carbon dioxide; land use and farming release methane and nitrous oxide; industry and waste release emissions and methane.</desc>
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0E6E6E"/></marker>
 </defs>
 <rect width="360" height="500" rx="18" fill="#F7F9F5"/>
 <g font-family="Segoe UI, system-ui, sans-serif">
  <g fill="#FFFFFF" stroke="#0E6E6E" stroke-width="2">
   <rect x="20" y="20" width="320" height="92" rx="14"/>
   <rect x="20" y="128" width="320" height="92" rx="14"/>
   <rect x="20" y="236" width="320" height="92" rx="14"/>
  </g>
  <g fill="#0B3D2E" font-size="20" font-weight="700">
   <text x="40" y="58">Fossil fuels</text>
   <text x="40" y="166">Land use and farming</text>
   <text x="40" y="274">Industry and waste</text>
  </g>
  <g fill="#1F2933" font-size="17">
   <text x="40" y="88">Carbon dioxide</text>
   <text x="40" y="196">Methane, nitrous oxide</text>
   <text x="40" y="304">Emissions, methane</text>
  </g>
  <path d="M180 334 L180 370" stroke="#0E6E6E" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <rect x="20" y="380" width="320" height="100" rx="50" fill="#0B3D2E"/>
  <g fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle">
   <text x="180" y="424">Greenhouse gases</text>
   <text x="180" y="450">in the atmosphere</text>
  </g>
 </g>
</svg>
